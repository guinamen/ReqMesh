schema_id = "elemento-requisito-v2;pt_BR"

# --- escalares e listas simples primeiro (ver convenção de ordem) ---

id = "UC-PIX-014"
tipo = "caso_de_uso"
nome = "Autorizar transferência Pix acima do limite noturno"
nivel = "objetivo_usuario"
prioridade = "alta"
frequencia = "3 a 5 mil ocorrências por noite útil; pico de 4x nos dois últimos dias úteis do mês."

descricao = """
Entre 20h00 e 06h00 vigora um limite de valor por transferência Pix mais
restritivo que o diurno. Quando o cliente confirma uma transferência acima
desse limite dentro da janela noturna, a operação não é recusada de imediato:
entra em autorização reforçada, em que o cliente prova posse do dispositivo
cadastrado e a operação passa a ser avaliada contra o limite diurno.

O escopo é a **decisão** de autorizar ou recusar. A liquidação junto ao SPI
é de UC-PIX-002, incluído a partir de P8.
"""

gatilho = "O cliente confirma uma transferência Pix cujo valor excede o limite noturno da conta, com o horário do servidor dentro da janela das 20h00 às 06h00."

pre_condicoes = [
  "O cliente está autenticado na sessão com fator de posse válido.",
  "A conta de origem tem saldo ou limite de crédito suficiente para o valor solicitado.",
  "A chave Pix de destino foi resolvida junto ao DICT e está ativa.",
  "O dispositivo em uso está cadastrado e vinculado ao CPF do cliente há pelo menos 24 horas.",
]

pos_condicoes = [
  "A ordem de pagamento foi entregue ao SPI e o cliente recebeu a confirmação.",
  "A decisão foi registrada na trilha de auditoria com o identificador da avaliação antifraude e o do desafio de posse.",
  "O limite noturno consumido pelo cliente no dia corrente foi atualizado.",
]

garantia_minima = [
  "A conta de origem nunca é debitada sem ordem entregue e confirmada pelo SPI.",
  "Nenhuma tentativa produz mais de uma ordem de pagamento para o mesmo par (conta, chave de idempotência).",
  "A trilha de auditoria registra a tentativa mesmo quando a operação é recusada em qualquer ponto.",
  "O escore antifraude e o motivo da recusa nunca chegam ao cliente.",
]

requisitos_especiais = [
  "A decisão de autorizar ou recusar cabe em 2 segundos no percentil 95, excluído o tempo de resposta do cliente ao desafio.",
  "O desafio de posse expira em 90 segundos.",
  "Recusa por antifraude e recusa por limite são indistinguíveis na interface e no tempo de resposta.",
  "A janela noturna é avaliada em horário de Brasília, com tratamento explícito de horário de verão caso volte a vigorar.",
]

questoes_em_aberto = [
  "O limite noturno consumido zera à meia-noite ou às 06h00? A virada de dia no meio da janela não foi decidida com produto.",
  "Cliente com mais de um dispositivo cadastrado pode responder ao desafio em qualquer um, ou só naquele em que iniciou a sessão?",
  "Autorização reforçada vale para contas com menos de 30 dias de abertura, ou essas caem direto na recusa?",
]

