schema_id = "elemento-requisito-v1;en_US"

id = "01-user-login"
type = "use_case"
name = "User login"

trigger = "User opens the home page and clicks 'Sign in'"
priority = "high"
level = "user_goal"
frequency = "Several times a day, per user"

description = """
Lets the user authenticate using **e-mail and password**.
"""

preconditions = ["User has a registered account"]

main_flow = [
  "User enters e-mail and password",
  "System validates the credentials",
  "System redirects to the dashboard",
]

postconditions = ["User authenticated with an active session"]
minimal_guarantee = ["No partial or inconsistent session is created on failure"]
special_requirements = ["Response within 1 second for 95% of attempts"]
open_issues = ["Decide the lockout policy after failed attempts"]

[[alternative_flows]]
condition = "Invalid credentials"
steps = [
  "System shows an error message",
  "Returns to step 1 of the main flow",
]

[[relations]]
type = "include"
target = "02-validate-credentials"
