[package]
name = "reqmeshval"
version = "0.1.0"
edition = "2021"
description = "Validador de arquivos de Elemento de Requisito (ReqMesh) contra um arquivo de schema localizado"
license = "MIT"  # ajuste para a licença real do projeto

[[bin]]
name = "reqMeshVal"
path = "src/main.rs"

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
